<!doctype html>
<html lang="es">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REBORN SENS">
  <link rel="apple-touch-icon" href="https://danielernestocalvillo2021-ops.github.io/DanX-Reborn/icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://danielernestocalvillo2021-ops.github.io/DanX-Reborn/icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>DanX Reborn</title>
<style>
:root{color-scheme:dark;--red:#e50920;--bg:#090909;--panel:#151515;--muted:#888}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#351015 0%,#111 38%,#070707 78%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;padding:18px}
.calc{width:min(100%,390px);background:rgba(10,10,10,.96);border:1px solid #3a171b;border-radius:28px;padding:22px;box-shadow:0 18px 55px #000b,0 0 24px #e5092018}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand strong{letter-spacing:2px;font-size:14px}.brand span{font-size:10px;color:#f04a59;letter-spacing:2px}
.display{min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:16px 6px 22px;overflow:hidden}
#expression{font-size:20px;color:#999;min-height:28px;word-break:break-all}
#result{font-size:clamp(42px,12vw,58px);font-weight:300;word-break:break-all;max-width:100%}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
button{border:0;border-radius:17px;min-height:67px;font-size:24px;font-weight:500;color:#fff;background:#202020;box-shadow:inset 0 1px #ffffff0c;touch-action:manipulation}
button:active{filter:brightness(1.35);transform:scale(.97)}
button.utility{background:#343434;color:#fff}
button.operator{background:#54121b;color:#ff6673}
button.equals{background:linear-gradient(145deg,#ff263d,#b90019);box-shadow:0 5px 18px #e5092040}
button.zero{grid-column:span 2}
.footer{text-align:center;color:#666;font-size:11px;margin-top:18px;letter-spacing:1px}
.status{min-height:18px;text-align:center;color:#ff6673;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main class="calc" aria-label="Calculadora negra y roja">
  <div class="brand"><strong>@dannx.rs</strong><span>REBORN SENS</span></div>
  <section class="display" aria-live="polite">
    <div id="expression"></div>
    <div id="result">0</div>
  </section>
  <section class="keys">
    <button class="utility" data-action="clear">AC</button>
    <button class="utility" data-action="sign">+/−</button>
    <button class="utility" data-action="percent">%</button>
    <button class="operator" data-value="/">÷</button>
    <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
    <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
    <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
    <button class="zero" data-value="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
  </section>
  <div id="status" class="status"></div>
  <div class="footer">TOCA = PARA ABRIR 3105</div>
</main>
<script>
(() => {
 const exprEl=document.getElementById('expression');
 const resultEl=document.getElementById('result');
 const statusEl=document.getElementById('status');
 let expr='';
 let justSolved=false;
 const render=()=>{exprEl.textContent=expr;resultEl.textContent=expr||'0';};
 const append=v=>{
   statusEl.textContent='';
   if(justSolved && /[0-9.]/.test(v)) expr='';
   justSolved=false;
   if(/[+\-*/]/.test(v)){
     if(!expr && v!=='-') return;
     if(/[+\-*/]$/.test(expr)) expr=expr.slice(0,-1);
   }
   expr+=v;render();
 };
 const calculate=()=>{
   if(!expr) return 0;
   if(!/^[0-9+\-*/.() ]+$/.test(expr)) throw Error('Operación no válida');
   const value=Function('"use strict";return ('+expr+')')();
   if(!Number.isFinite(value)) throw Error('No se puede dividir entre cero');
   return Number.parseFloat(value.toPrecision(12));
 };
 const launch3105=()=>{
   // Ejecuta el atajo creado por el usuario en la app Atajos.
   window.location.href='shortcuts://run-shortcut?name=Abrir%203105';
   statusEl.textContent='Abriendo el atajo Abrir 3105…';
 };
 document.querySelector('.keys').addEventListener('click',e=>{
   const b=e.target.closest('button');if(!b)return;
   const v=b.dataset.value, a=b.dataset.action;
   if(v){append(v);return;}
   if(a==='clear'){expr='';justSolved=false;statusEl.textContent='';render();}
   if(a==='decimal'){
     const part=expr.split(/[+\-*/]/).pop();
     if(!part.includes('.')) append(part?'.':'0.');
   }
   if(a==='sign'){
     if(!expr)return;
     const m=expr.match(/(^|[+\-*/])(\d*\.?\d+)$/);
     if(m){const start=expr.length-m[2].length;expr=expr.slice(0,start)+(m[2].startsWith('-')?m[2].slice(1):'-'+m[2]);render();}
   }
   if(a==='percent'){
     const m=expr.match(/(\d*\.?\d+)$/);
     if(m){expr=expr.slice(0,-m[1].length)+String(Number(m[1])/100);render();}
   }
   if(a==='equals'){
     try{
       const answer=calculate();
       exprEl.textContent=expr+' =';
       resultEl.textContent=String(answer);
       expr=String(answer);justSolved=true;
     }catch(err){statusEl.textContent=err.message;return;}
     launch3105();
   }
 });
 document.addEventListener('keydown',e=>{
   if(/[0-9.+\-*/]/.test(e.key)&&e.key.length===1)append(e.key);
   else if(e.key==='Enter'||e.key==='='){e.preventDefault();document.querySelector('[data-action="equals"]').click();}
   else if(e.key==='Escape'||e.key==='Backspace'){expr=e.key==='Escape'?'':expr.slice(0,-1);render();}
 });
 render();
})();
</script>
</body>
</html>
